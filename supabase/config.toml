project_id = "hearth"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "reporting"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://hearth.example"
additional_redirect_urls = ["https://hearth.example/**", "https://*.vercel.app/**"]
jwt_expiry = 2592000
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.send-booking-email]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.nightly-reminders]
verify_jwt = false
